name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The version is READ, never typed. A hand-entered release input is exactly what cut
      # `v1.1.0` against a manifest still declaring `0.1.0`: the tag and the number a user
      # actually installs came from two places and nothing compared them. One source, one value,
      # and the disagreement becomes unrepresentable rather than merely discouraged.
      - name: Derive the version from the plugin manifest
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          PACKAGED=$(python3 -c "import re, pathlib; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(encoding='utf-8'), re.M).group(1))")
          if [ "$VERSION" != "$PACKAGED" ]; then
            echo "plugin.json declares $VERSION but pyproject.toml declares $PACKAGED" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing v$VERSION"

      - name: Run the gates
        id: gates
        run: |
          python3 -m pip install -e .
          # THE COUNT IS THE CHECK, same as ci.yml's unit-suite step and for the same reason:
          # `unittest discover` prints OK and exits 0 when it collects NOTHING, so a bare
          # `discover` call reports green forever on a suite that stopped being found. ci.yml
          # already guarded against that and this workflow -- the one that decides what ships --
          # did not, so a release could be cut on a suite that ran zero tests.
          set +e
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/unittest.log
          status=${PIPESTATUS[0]}
          set -e
          ran=$(sed -n 's/^Ran \([0-9][0-9]*\) test.*/\1/p' /tmp/unittest.log | tail -1)
          if [ "$status" -ne 0 ]; then
            echo "Unit suite failed with status $status."
            exit "$status"
          fi
          if [ -z "$ran" ] || [ "$ran" -eq 0 ]; then
            echo "No tests were collected. Finding nothing is not finding nothing wrong."
            exit 1
          fi
          echo "Unit suite passed: $ran tests ran."
          echo "ran=$ran" >> "$GITHUB_OUTPUT"
          # THE REPLAY'S OWN DENOMINATOR, carried forward. The release notes used to state a
          # hard-coded "6/6 corpus replay" and an "82-test suite"; the corpus had grown to 13
          # sessions and the suite to over 130, so every release published two false numbers
          # about the verification it had just performed. Both are read from the runs
          # themselves now, and a replay that prints no denominator fails the release.
          set +e
          python3 eval/replay.py | tee /tmp/replay.log
          replay_status=${PIPESTATUS[0]}
          set -e
          if [ "$replay_status" -ne 0 ]; then
            echo "Corpus replay failed with status $replay_status."
            exit "$replay_status"
          fi
          summary=$(sed -n 's/^REPLAY sessions=\([0-9][0-9]*\) passed=\([0-9][0-9]*\) failed=\([0-9][0-9]*\).*/\1 \2 \3/p' /tmp/replay.log | tail -1)
          if [ -z "$summary" ]; then
            echo "eval/replay.py printed no denominator; its exit code stands on nothing."
            exit 1
          fi
          set -- $summary
          if [ "$1" -eq 0 ] || [ "$2" -ne "$1" ] || [ "$3" -ne 0 ]; then
            echo "Corpus replay reported sessions=$1 passed=$2 failed=$3."
            exit 1
          fi
          echo "replay_sessions=$1" >> "$GITHUB_OUTPUT"
          echo "replay_passed=$2" >> "$GITHUB_OUTPUT"

      - name: Build the install bundle (no eval, no tests, no tooling)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="ward-$VERSION"
          mkdir "$STAGE"
          cp -r plugin/ward plugin/hooks plugin/.claude-plugin \
             pyproject.toml LICENSE NOTICE README.md SECURITY.md "$STAGE"/
          zip -qr "ward-$VERSION.zip" "$STAGE"
          # THE LISTING IS READ ONCE, AND ITS OWN EXIT CODE IS CHECKED. Piping `unzip -l`
          # straight into `grep -q` hides a failed unzip: without pipefail the pipeline's status
          # is grep's, an unreadable or corrupt archive gives grep no input, grep returns 1, and
          # `&& exit 1 || true` turns that into SUCCESS -- the same verdict as "inspected and
          # contains no eval/". Verified by running it: a listing of a nonexistent archive exits
          # the gate 0. An archive that cannot be read has not been inspected.
          if ! LISTING=$(unzip -l "ward-$VERSION.zip"); then
            echo "could not list ward-$VERSION.zip; the bundle was not inspected"
            exit 1
          fi
          if printf '%s' "$LISTING" | grep -q "eval/"; then
            echo "the install bundle contains eval/"
            exit 1
          fi
          # Asserted, not assumed. The bundle copies plugin/ contents, so a test file can only
          # appear here if the suite moved back inside the installed subtree -- which is the
          # thing this layout exists to prevent, and it would look correct from the outside.
          if printf '%s' "$LISTING" | grep -q "tests/"; then
            echo "the install bundle contains tests/"
            exit 1
          fi

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "ward $VERSION"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Stateless PreToolUse deny table: 11 predicate rows plus a cannot-evaluate preflight, every denial cited and carrying a retry hint. Verified at release time: the ${{ steps.gates.outputs.ran }}-test suite and the ${{ steps.gates.outputs.replay_passed }}/${{ steps.gates.outputs.replay_sessions }} corpus replay (\`python3 eval/replay.py\`). Install from \`ward-$VERSION.zip\` — it carries the dispatcher, hooks, and manifests only; the eval corpus and tests live in the repository, not the release bundle." \
            "ward-$VERSION.zip"
