<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ward dispatch flow</title>
  <desc id="desc">A pending tool call passes through one entrypoint and an ordered eleven-row denial table, producing either a deny with a row citation or silent empty JSON.</desc>
  <style>
    .background { fill: #f6f8fa; }
    .frame { fill: #ffffff; stroke: #d0d7de; }
    .table { fill: #eef6ff; stroke: #0969da; }
    .deny { fill: #fff1f0; stroke: #cf222e; }
    .silent { fill: #f0fff4; stroke: #1a7f37; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .line { stroke: #57606a; }
    .row { stroke: #b6d6fa; }
    .accent { fill: #0969da; }
    .deny-accent { fill: #cf222e; }
    .silent-accent { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .frame { fill: #161b22; stroke: #30363d; }
      .table { fill: #0c2d4a; stroke: #58a6ff; }
      .deny { fill: #3b1519; stroke: #ff7b72; }
      .silent { fill: #102b1b; stroke: #56d364; }
      .ink { fill: #f0f6fc; }
      .muted { fill: #b1bac4; }
      .line { stroke: #8c959f; }
      .row { stroke: #275d8c; }
      .accent { fill: #58a6ff; }
      .deny-accent { fill: #ff7b72; }
      .silent-accent { fill: #56d364; }
    }
  </style>

  <rect class="background" x="1" y="1" width="1198" height="358" rx="18"/>

  <rect class="frame" x="42" y="126" width="190" height="108" rx="14" stroke-width="2"/>
  <circle class="accent" cx="75" cy="158" r="7"/>
  <text class="ink" x="96" y="164" font-family="system-ui, sans-serif" font-size="19" font-weight="700">pending tool call</text>
  <text class="muted" x="75" y="198" font-family="monospace" font-size="15">PreToolUse JSON</text>

  <path class="line" d="M232 180H293" fill="none" stroke-width="2.5"/>
  <path class="line" d="M286 173L296 180L286 187" fill="none" stroke-width="2.5"/>

  <rect class="frame" x="296" y="126" width="218" height="108" rx="14" stroke-width="2"/>
  <text class="muted" x="323" y="158" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ONE ENTRYPOINT</text>
  <text class="ink" x="323" y="190" font-family="monospace" font-size="17" font-weight="700">hooks/dispatch.sh</text>
  <text class="muted" x="323" y="216" font-family="monospace" font-size="14">ward.dispatch</text>

  <path class="line" d="M514 180H574" fill="none" stroke-width="2.5"/>
  <path class="line" d="M567 173L577 180L567 187" fill="none" stroke-width="2.5"/>

  <rect class="table" x="577" y="48" width="284" height="264" rx="14" stroke-width="2"/>
  <text class="ink" x="607" y="80" font-family="system-ui, sans-serif" font-size="18" font-weight="750">ordered CHECKS table</text>
  <text class="muted" x="607" y="104" font-family="system-ui, sans-serif" font-size="14">first matching row wins</text>
  <g class="row" stroke-width="1">
    <path d="M607 122H831 M607 137H831 M607 152H831 M607 167H831 M607 182H831 M607 197H831"/>
    <path d="M607 212H831 M607 227H831 M607 242H831 M607 257H831 M607 272H831"/>
  </g>
  <g class="accent">
    <circle cx="617" cy="122" r="3"/><circle cx="617" cy="137" r="3"/>
    <circle cx="617" cy="152" r="3"/><circle cx="617" cy="167" r="3"/>
    <circle cx="617" cy="182" r="3"/><circle cx="617" cy="197" r="3"/>
    <circle cx="617" cy="212" r="3"/><circle cx="617" cy="227" r="3"/>
    <circle cx="617" cy="242" r="3"/><circle cx="617" cy="257" r="3"/>
    <circle cx="617" cy="272" r="3"/>
  </g>
  <text class="ink" x="741" y="296" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700">11 rows</text>

  <path class="line" d="M861 180H907V108H948" fill="none" stroke-width="2.5"/>
  <path class="line" d="M861 180H907V252H948" fill="none" stroke-width="2.5"/>
  <path class="line" d="M941 101L951 108L941 115" fill="none" stroke-width="2.5"/>
  <path class="line" d="M941 245L951 252L941 259" fill="none" stroke-width="2.5"/>

  <text class="muted" x="879" y="96" font-family="system-ui, sans-serif" font-size="13">match</text>
  <text class="muted" x="866" y="239" font-family="system-ui, sans-serif" font-size="13">no match</text>

  <rect class="deny" x="951" y="55" width="207" height="106" rx="14" stroke-width="2"/>
  <circle class="deny-accent" cx="982" cy="87" r="7"/>
  <text class="ink" x="1002" y="93" font-family="system-ui, sans-serif" font-size="18" font-weight="750">deny</text>
  <text class="muted" x="982" y="123" font-family="system-ui, sans-serif" font-size="14">with row citation</text>
  <text class="muted" x="982" y="144" font-family="system-ui, sans-serif" font-size="14">and retry hint</text>

  <rect class="silent" x="951" y="199" width="207" height="106" rx="14" stroke-width="2"/>
  <circle class="silent-accent" cx="982" cy="231" r="7"/>
  <text class="ink" x="1002" y="237" font-family="system-ui, sans-serif" font-size="18" font-weight="750">silent</text>
  <text class="ink" x="982" y="275" font-family="monospace" font-size="24" font-weight="700">{}</text>
</svg>
