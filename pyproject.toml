[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ward"
version = "1.1.0"
description = "11 exact, no-substitute PreToolUse hard denies for actions dangerous regardless of intent or honesty"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
# The package lives under plugin/ -- that directory IS the installed plugin, and nothing
# outside it ships. See .claude-plugin/marketplace.json.
where = ["plugin"]
include = ["ward*"]

[tool.pytest.ini_options]
# The suite runs under `python -m unittest discover -s tests`, which picks up the
# package from `pip install -e .` (see .github/workflows/). This table only helps a
# contributor who reaches for pytest against an uninstalled checkout.
pythonpath = ["plugin"]
